<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <!-- Tuning Fork Circle Icon -->
  <g transform="translate(10, 10)">
    <circle cx="70" cy="65" r="58" fill="none" stroke="#E62129" stroke-width="14"/>
    <circle cx="70" cy="65" r="22" fill="none" stroke="#E62129" stroke-width="8"/>
    <!-- Tuning forks -->
    <path d="M 70,65 L 70,12" stroke="#E62129" stroke-width="10" stroke-linecap="round"/>
    <path d="M 70,65 L 24,92" stroke="#E62129" stroke-width="10" stroke-linecap="round"/>
    <path d="M 70,65 L 116,92" stroke="#E62129" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- YAMAHA Text -->
  <text x="160" y="105" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="115" fill="#E62129" letter-spacing="4">
    YAMAHA
  </text>

  <!-- Revs Your Heart Italic Script -->
  <text x="95" y="185" font-family="'Georgia', 'Times New Roman', serif" font-style="italic" font-weight="bold" font-size="52" fill="#1A1A1A" letter-spacing="-1">
    Revs Your Heart
  </text>
  <line x1="90" y1="210" x2="560" y2="165" stroke="#1A1A1A" stroke-width="4"/>

  <!-- SEMAKIN DI DEPAN Italic Block -->
  <text x="25" y="275" font-family="'Impact', 'Arial Black', sans-serif" font-style="italic" font-weight="900" font-size="48" fill="#0A73BA" letter-spacing="2">
    SEMAKIN DI DEPAN
  </text>
</svg>
